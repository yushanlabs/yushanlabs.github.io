<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>學測詞彙每日 10 題</title>
<meta name="description" content="每天 10 題學測詞彙選擇題，中級 5 題、中高級 5 題，點選就對答案。">
<meta property="og:title" content="學測詞彙每日 10 題：今天你能答對幾題？">
<meta property="og:description" content="中級 5 題＋中高級 5 題，句子都來自「記憶曲線單字」App 的例句。">
<meta property="og:image" content="https://yushanlabs.github.io/assets/icons/gept.png">
<meta property="og:url" content="https://yushanlabs.github.io/daily/">
<meta name="theme-color" content="#1D5D71">
<link rel="icon" href="../assets/icons/gept.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/icons/gept.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Spectral:ital,wght@0,500;0,600;1,400&display=swap">
<style>
/* Layout: 一欄試卷——上方日期與得分，中間 10 題（點了就對答案），下方 App 推廣與往期題目 */
:root{
  --bg:#EFF2EE; --surface:#FAFBF8; --fg:#1B292D; --muted:#5A696B; --line:#D2D9D3;
  --accent:#1D5D71; --accent-soft:#DCE8EA; --on-accent:#FFFFFF;
  --wrong:#A9432F; --wrong-soft:#F4E2DC; --good:#2F6B45; --good-soft:#DDEBE0;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --latin:"Spectral",Georgia,"Times New Roman",serif;
  --body:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111819; --surface:#182224; --fg:#E2EAE7; --muted:#97A6A6; --line:#2C3A3C;
    --accent:#7DB5C6; --accent-soft:#1F3439; --on-accent:#0E1A1D;
    --wrong:#E07A64; --wrong-soft:#3A2420; --good:#79BE8F; --good-soft:#1C3324; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111819; --surface:#182224; --fg:#E2EAE7; --muted:#97A6A6; --line:#2C3A3C;
  --accent:#7DB5C6; --accent-soft:#1F3439; --on-accent:#0E1A1D;
  --wrong:#E07A64; --wrong-soft:#3A2420; --good:#79BE8F; --good-soft:#1C3324; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;font-weight:700}
h1{font-size:clamp(28px,6vw,40px);line-height:1.2;letter-spacing:.02em}
h2{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
button,a{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-direction:column;gap:8px}
.score{display:flex;align-items:baseline;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;
  position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:2}
.score b{font-family:var(--latin);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.score .muted{font-size:13px}
.score .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;align-self:center;margin-left:6px}
.score .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}

#qs{display:flex;flex-direction:column;gap:14px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.q .tag{font-size:12px;color:var(--muted);display:flex;gap:8px}
.q .tag .lv{border:1px solid var(--line);border-radius:999px;padding:0 8px}
.stem{font-family:var(--latin);font-size:19px;line-height:1.55}
.stem .n{font-family:var(--body);font-weight:700;font-size:15px;margin-right:6px;color:var(--muted)}
.stem .blank{display:inline-block;min-width:5.5em;border-bottom:2px solid var(--fg);text-align:center;font-weight:600}
.stem .blank.ok{color:var(--good);border-color:var(--good)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:center;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:11px 14px;font-family:var(--latin);font-size:17px;min-height:48px}
.opt .k{font-family:var(--body);font-size:13px;color:var(--muted);width:1.6em;flex:none}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.opt.wrong{background:var(--wrong-soft);border-color:var(--wrong);color:var(--wrong);text-decoration:line-through}
.opt.dim{opacity:.55}
.explain{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.explain .verdict{font-weight:700}
.explain .verdict.ok{color:var(--good)} .explain .verdict.no{color:var(--wrong)}
.explain .word{font-family:var(--latin);font-weight:600;font-size:16px}
.explain .others{color:var(--muted)}
.explain .others span{font-family:var(--latin)}

.done{background:var(--accent);color:var(--on-accent);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.done h2{font-size:24px}
.done .row{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:0;border-radius:999px;padding:11px 22px;font-weight:600;font-size:15px;text-decoration:none;display:inline-block}
.btn.light{background:var(--on-accent);color:var(--accent)}
.btn.ghost{background:transparent;border:1px solid currentColor;color:inherit}
.btn.main{background:var(--accent);color:var(--on-accent)}

.promo{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.promo img{width:60px;height:60px;border-radius:14px;flex:none}
.promo .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.promo .t b{font-size:16px}
.promo .t span{font-size:13px;color:var(--muted)}
@media (max-width:480px){.promo{flex-wrap:wrap}.promo .btn{width:100%;text-align:center}}

.archive{display:flex;flex-direction:column;gap:10px}
.archive ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.archive a{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:14px;text-decoration:none;background:var(--surface)}
.archive a.cur{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.archive a .s{color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.archive a.cur .s{color:inherit;opacity:.8}
footer{font-size:12px;color:var(--muted);text-align:center}
footer a{color:inherit}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);
  padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow" id="dateline">學測詞彙</p>
    <h1>學測詞彙每日 10 題</h1>
    <p class="muted">所有選項都在大考中心《高中英文參考詞彙表》內。前 5 題英檢中級、後 5 題中高級，點選項就對答案。</p>
  </header>

  <div class="score" aria-live="polite"><b id="sc">0</b><span class="muted" id="scl">／10 答對</span><span class="bar"><i id="bar"></i></span></div>

  <main id="qs"><p class="muted">題目載入中…</p></main>

  <section class="done" id="done" hidden>
    <h2 id="doneTitle"></h2>
    <p id="doneMsg"></p>
    <div class="row">
      <button class="btn light" id="share">分享今天的成績</button>
      <button class="btn ghost" id="retry">錯的題目再做一次</button>
    </div>
  </section>

  <section class="promo">
    <img src="../assets/icons/gept.png" alt="">
    <div class="t"><b>題目句子都來自「記憶曲線單字」</b><span>全民英檢初級到中高級，FSRS 會在你快忘記的時候把字丟回來考你。每一級都可以先免費試 200 個字。</span></div>
    <a class="btn main" href="https://apps.apple.com/tw/app/id6821861109">App Store</a>
  </section>

  <section class="archive" id="archive" hidden>
    <h2>往期題目</h2>
    <ul id="days"></ul>
  </section>

  <footer>每天臺灣時間 0 點換新題目・<a href="../">Yushan Labs</a></footer>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const KEYS = 'ABCD';
  const store = {
    get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  };
  // 臺灣日期（YYYY-MM-DD）
  const today = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  let days = [], cur = null, picks = [];

  function fmtDate(iso){ const [y,m,d] = iso.split('-').map(Number); const w = '日一二三四五六'[new Date(Date.UTC(y,m-1,d)).getUTCDay()]; return `${m} 月 ${d} 日（${w}）`; }
  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function key(d){ return 'daily-quiz-' + d.date; }

  function render(){
    $('dateline').textContent = `第 ${cur.day} 天・${fmtDate(cur.date)}`;
    const box = $('qs'); box.innerHTML = '';
    cur.items.forEach((it, i) => {
      const q = document.createElement('article'); q.className = 'q';
      const parts = it.stem.split('_____');
      q.innerHTML = `<div class="tag"><span class="lv">英檢${it.level}</span><span class="lv">學測第 ${it.ceec} 級</span></div>
        <p class="stem"><span class="n">${i+1}.</span>${esc(parts[0])}<span class="blank">&nbsp;</span>${esc(parts[1] || '')}</p>
        <div class="opts">${it.opts.map((o,j) => `<button class="opt" data-j="${j}"><span class="k">(${KEYS[j]})</span>${esc(o)}</button>`).join('')}</div>
        <div class="explain" hidden></div>`;
      q.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => pick(i, +b.dataset.j)));
      box.appendChild(q);
      if (picks[i] != null) show(i, false);
    });
    score();
  }

  function pick(i, j){
    if (picks[i] != null) return;
    picks[i] = j; store.set(key(cur), picks);
    show(i, true); score();
  }

  function show(i, scroll){
    const it = cur.items[i], j = picks[i], q = $('qs').children[i], ok = j === it.ans;
    q.querySelectorAll('.opt').forEach((b, k) => {
      b.disabled = true;
      if (k === it.ans) b.classList.add('right');
      else if (k === j) b.classList.add('wrong');
      else b.classList.add('dim');
    });
    const bl = q.querySelector('.blank'); bl.textContent = it.opts[it.ans]; bl.classList.add('ok');
    const ex = q.querySelector('.explain'); ex.hidden = false;
    ex.innerHTML = `<span class="verdict ${ok ? 'ok' : 'no'}">${ok ? '答對了' : '答錯了，答案是 (' + KEYS[it.ans] + ')'}</span>
      <span><span class="word">${esc(it.opts[it.ans])}</span>　${esc(it.zh)}</span>
      <span>${esc(it.exZh)}</span>
      <span class="others">其他選項：${it.others.map(o => `<span>${esc(o[0])}</span> ${esc(o[1])}`).join('、')}</span>`;
    if (scroll && i + 1 < cur.items.length && !ok) return; // 答錯先留在這題看解釋
    if (scroll && i + 1 < cur.items.length) setTimeout(() => $('qs').children[i+1].scrollIntoView({behavior:'smooth', block:'center'}), 700);
  }

  function score(){
    const n = cur.items.length, answered = picks.filter(p => p != null).length;
    const right = cur.items.filter((it, i) => picks[i] === it.ans).length;
    $('sc').textContent = right; $('scl').textContent = `／${n} 答對・已做 ${answered} 題`;
    $('bar').style.width = (answered / n * 100) + '%';
    const done = answered === n; $('done').hidden = !done;
    if (done){
      $('doneTitle').textContent = `今天答對 ${right}／${n} 題`;
      $('doneMsg').textContent = right === n ? '全對！明天見。' :
        right >= 7 ? '很不錯。錯的那幾個字，就是最值得複習的字。' :
        right >= 4 ? '這些字背過也很容易忘，錯了正好知道要複習哪幾個。' : '別灰心，這些都是學測常見的難字，明天再來。';
      $('retry').hidden = right === n;
    }
    renderArchive();
  }

  function renderArchive(){
    const avail = days.filter(d => d.date <= today);
    $('archive').hidden = avail.length < 2;
    $('days').innerHTML = avail.slice().reverse().map(d => {
      const p = store.get(key(d)) || [];
      const r = d.items.filter((it, i) => p[i] === it.ans).length, a = p.filter(x => x != null).length;
      const [, m, dd] = d.date.split('-').map(Number);
      return `<li><a href="?d=${d.day}" class="${d === cur ? 'cur' : ''}">第 ${d.day} 天・${m}/${dd}${a ? `<span class="s">${r}/${d.items.length}</span>` : ''}</a></li>`;
    }).join('');
  }

  function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 1800); }

  $('share').addEventListener('click', async () => {
    const right = cur.items.filter((it, i) => picks[i] === it.ans).length;
    const text = `學測詞彙每日 10 題，第 ${cur.day} 天我答對 ${right}／${cur.items.length} 題，你呢？`;
    const url = location.origin + location.pathname;
    try {
      if (navigator.share) { await navigator.share({title:'學測詞彙每日 10 題', text, url}); return; }
      await navigator.clipboard.writeText(text + ' ' + url); toast('已複製，可以貼給朋友');
    } catch(e){ if (e && e.name !== 'AbortError') toast('分享失敗，可以直接複製網址'); }
  });
  $('retry').addEventListener('click', () => {
    picks = picks.map((p, i) => p === cur.items[i].ans ? p : null);
    store.set(key(cur), picks); render();
    const first = picks.findIndex(p => p == null);
    if (first >= 0) $('qs').children[first].scrollIntoView({behavior:'smooth', block:'center'});
  });

  fetch('days.json', {cache:'no-cache'}).then(r => r.json()).then(all => {
    days = all;
    const avail = days.filter(d => d.date <= today);
    const want = +new URLSearchParams(location.search).get('d');
    cur = avail.find(d => d.day === want) || avail[avail.length - 1] || days[0];
    picks = store.get(key(cur)) || [];
    render();
  }).catch(() => { $('qs').innerHTML = '<p class="muted">題目載入失敗，請重新整理。</p>'; });
})();
</script>
</body>
</html>
